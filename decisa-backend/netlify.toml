[build]
  command = "npx prisma generate && cd ../decisa-frontend && npm install --include=dev && npm run build"
  publish = "../decisa-frontend/dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200